<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Prueba técnica ePayco · Staging</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; padding: 32px 16px; font: 16px/1.5 system-ui, sans-serif; color: #2d241f; background: #f7f4f1; }
    main { max-width: 620px; margin: 5vh auto; padding: 28px; background: white; border: 1px solid #e5dcd6; border-radius: 12px; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .status { padding: 12px; background: #f6f2ef; border-radius: 8px; overflow-wrap: anywhere; }
    button { margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 7px; background: #513229; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    small { color: #6b5a53; }
  </style>
</head>
<body>
<main>
  <h1>Prueba técnica ePayco</h1>
  <p>Entorno de staging. Importe esperado: $2.000 COP. Modo de pruebas.</p>
  <p id="status" class="status" role="status" aria-live="polite">Comprobando la sesión y cargando ePayco…</p>
  <button id="pay" type="button" disabled>Abrir checkout de prueba</button>
  <p><small>Esta página técnica no cambia las fechas, precios ni cupos del evento público.</small></p>
</main>
<script>
(() => {
  const statusBox = document.getElementById("status");
  const button = document.getElementById("pay");
  const params = new URLSearchParams(window.location.hash.slice(1));
  const sessionId = (params.get("sessionId") || "").trim();
  let sdkReady = false;
  let opening = false;

  function setStatus(message) {
    statusBox.textContent = message;
  }

  function updateReady() {
    if (!sessionId) {
      setStatus("No se recibió el identificador de sesión. Abre esta página desde el comando PowerShell que usa la sesión ePayco existente.");
      button.disabled = true;
      return;
    }
    if (sdkReady) {
      setStatus("Sesión recibida y SDK ePayco cargado. Pulsa el botón para continuar.");
      button.disabled = false;
    }
  }

  button.addEventListener("click", () => {
    if (!sdkReady || !sessionId || opening) return;
    opening = true;
    button.disabled = true;
    setStatus("Inicializando el checkout seguro de ePayco…");
    try {
      const checkout = window.ePayco.checkout.configure({
        sessionId,
        type: "standard",
        test: true
      });
      if (typeof checkout.setHooks === "function") {
        checkout.setHooks({
          onCreated: () => setStatus("Checkout inicializado por ePayco."),
          onResponse: () => setStatus("ePayco devolvió una respuesta. Consulta ahora el estado del pedido en staging."),
          onClosed: () => {
            setStatus("Se cerró el checkout antes de confirmar el resultado. Consulta el estado del pedido en staging.");
            opening = false;
            button.disabled = false;
          },
          onErrors: (error) => {
            setStatus("ePayco reportó un error al abrir el checkout: " + (error && error.message ? error.message : "error de inicialización"));
            opening = false;
            button.disabled = false;
          }
        });
      }
      checkout.open();
      setStatus("Se solicitó abrir el checkout de ePayco. Si no aparece, la sesión o el servicio de checkout debe revisarse; no se ha confirmado ningún pago desde esta página.");
    } catch (error) {
      opening = false;
      button.disabled = false;
      setStatus("No se pudo inicializar ePayco: " + (error && error.message ? error.message : "error desconocido"));
    }
  });

  const script = document.createElement("script");
  script.src = "https://checkout.epayco.co/checkout-v2.js";
  script.onload = () => {
    sdkReady = !!(window.ePayco && window.ePayco.checkout && window.ePayco.checkout.configure);
    if (sdkReady) updateReady();
    else setStatus("El archivo del SDK cargó, pero ePayco no expuso checkout.configure.");
  };
  script.onerror = () => setStatus("No se pudo descargar el SDK de ePayco. Revisa el acceso de red a checkout.epayco.co.");
  document.head.appendChild(script);
  if (sessionId) setStatus("Sesión recibida. Cargando el servicio de ePayco…");
  else updateReady();
})();
</script>
</body>
</html>
